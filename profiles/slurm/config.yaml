# =============================================================================
# Snakemake workflow profile for SLURM clusters
# =============================================================================
# Launch with:  snakemake --workflow-profile profiles/slurm
# Requires:     snakemake>=8 and snakemake-executor-plugin-slurm. Conda
#               deployment is set below, so --sdm conda is not needed.
#
# THREE LINES MUST BE EDITED before this will run anywhere:
#   default-resources.slurm_account     your allocation
#   default-resources.slurm_partition   the queue to submit to
#   default-resources.slurm_extra       any additional sbatch flags, or ""
#
# The per-rule overrides below are sized for a 2 Mb bacterial genome with
# roughly 20 M reads per sample. They are starting points: a rule that runs out
# of memory or time is telling you to raise its entry, not that the workflow is
# broken.
#
# Developed on ISAAC-NG at the University of Tennessee, where the values were
# account=acf-utk0009, partition=condo-rmccord, slurm_extra="'--qos=condo'".
# =============================================================================

executor: slurm
software-deployment-method: conda      # === --sdm conda
use-conda: true

jobs: 20                                # max concurrent SLURM jobs
latency-wait: 60
retries: 1
keep-going: true
printshellcmds: true
rerun-incomplete: true

# --- resources applied to every rule unless overridden below -----------------
default-resources:
  slurm_account: "YOUR_ACCOUNT"        # <-- edit
  slurm_partition: "YOUR_PARTITION"    # <-- edit
  slurm_extra: ""                      # <-- edit, e.g. "'--qos=normal'", or leave empty
  mem_mb: 8000
  runtime: 120                         # minutes
  cpus_per_task: 4

# --- per-rule overrides (rule names must match those in the workflow) --------
set-resources:
  chipexoqual:
    mem_mb: 16000
    runtime: 180
    cpus_per_task: 4
  deeptools_fingerprint:
    mem_mb: 16000
    runtime: 240
    cpus_per_task: 8
  deeptools_multibamsummary:
    mem_mb: 16000
    runtime: 240
    cpus_per_task: 8
  deeptools_fragsize:
    mem_mb: 12000
    runtime: 180
    cpus_per_task: 8
  samtools_stats:
    mem_mb: 8000
    cpus_per_task: 4
  stage_delivery:
    # extraction is I/O-bound and single-threaded; give it time + local disk
    mem_mb: 8000
    runtime: 180
    cpus_per_task: 1

set-threads:
  deeptools_fingerprint: 8
  deeptools_multibamsummary: 8
  deeptools_fragsize: 8
  chipexoqual: 4
  samtools_index: 4
  samtools_stats: 4
