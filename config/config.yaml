# =============================================================================
# PerR ChIP-exo workflow — configuration
# =============================================================================
# The ONLY thing a user must edit is `input_zip` (path to the sequencing-core
# delivery). Everything else is auto-discovered from the archive's file names.
# =============================================================================

# Path to the exact .zip delivered by the sequencing core (CEGR / Cornell EGC).
# May be absolute or relative to the directory you launch Snakemake from.
input_zip: "data/844_LBurcham_UTenn.zip"

# All results are written under this directory (created automatically).
results_dir: "results"

# -----------------------------------------------------------------------------
# Strains present in this delivery.
#   prefix   : leading token of the CEGR "sample" field (e.g. A9091 -> A909)
#   accession: reference the CORE aligned to (read straight from your Report;
#              this MUST match the BAM @SQ header — the workflow checks it)
#   chrom_len: expected chromosome length in bp (optional; used for a soft
#              header sanity-check only). Leave as null to skip that check.
# A909  = serotype Ia,  NC_007432.1   (complete, 2,127,839 bp)
# CJB111 = serotype V,  NZ_CP063198.2 (2021 closed assembly)
# -----------------------------------------------------------------------------
strains:
  A909:
    prefix: "A909"
    accession: "NC_007432.1"        # sequence accession (BAM @SQ / header check)
    assembly: "GCF_000012705.1"     # assembly accession (NCBI datasets download)
    chrom_len: 2127839
  CJB111:
    prefix: "CJB111"
    accession: "NZ_CP063198.2"
    assembly: "GCF_015221735.2"
    chrom_len: 2093987

# -----------------------------------------------------------------------------
# How to read the CEGR file-name convention:
#   {coreID}_{tag}_{antibody}_{sample}_-_-_-_{assay}_{suffix}
#   e.g. 43893_6xHis_ab9108_A9091_-_-_-_BX_FilteredBAM.bam
#   tag == "6xHis" -> IP ; tag == "NoTag" -> background control
#   sample trailing "C" -> control ; trailing digit -> replicate number
# These tokens are what the parser keys on; change only if the core changes
# their naming scheme.
# -----------------------------------------------------------------------------
naming:
  ip_tag: "6xHis"
  control_tag: "NoTag"
  bam_suffix: "_FilteredBAM.bam"
  r1_suffix: "_R1.fastq.gz"
  r2_suffix: "_R2.fastq.gz"
  fwd_bw_suffix: "_forward.bw"
  rev_bw_suffix: "_reverse.bw"

# -----------------------------------------------------------------------------
# QC parameters / thresholds.
# Thresholds are reported as advisory flags, not hard failures, because
# ChIP-exo intentionally violates several ChIP-seq QC conventions (e.g. it is
# expected to be highly duplicated at footprint borders; Carroll et al. 2014).
# -----------------------------------------------------------------------------
qc:
  fastqc_kmers: 7
  # deepTools fingerprint / correlation
  deeptools_binsize: 500
  deeptools_extra: ""            # e.g. "--minMappingQuality 30"
  # ChIPexoQual subsampling depth (islands); NULL = use all reads
  chipexoqual_mc_cores: 4
  # Advisory thresholds for the scorecard (see docs/QC_METRICS.md)
  min_uniquely_mapped: 2000000   # ENCODE/modENCODE point-source floor
  fsr_balanced_low: 0.4          # forward-strand ratio "balanced" window
  fsr_balanced_high: 0.6

# ChIPexoQual: deep coverage on a ~2 Mb genome merges all reads into one
  # island. Subsample to a FIXED read count so beta1/beta2 are comparable
  # across samples of differing depth (measured: CJB111 full=1 island,
  # 5%=311, 1%=7593).
  chipexoqual_target_reads: 250000
  chipexoqual_subsample_seed: 42
  chipexoqual_ladder_depths: [50000, 100000, 200000]

# -----------------------------------------------------------------------------
# Reference acquisition (needed by the PEAKS stage, not by QC).
# Downloads genome FASTA + GFF3 per accession via the NCBI `datasets` CLI.
# Compute nodes on many HPCs lack internet: run the reference rules on a
# login/transfer node first, e.g.
#   snakemake --sdm conda -c1 get_reference_all
# then run peak calling on a compute/interactive node.
# -----------------------------------------------------------------------------
reference:
  outdir: "resources/reference"

# -----------------------------------------------------------------------------
# Peak calling (ChExMix, primary caller).
# ChExMix is the Pugh/Mahony ChIP-exo mixture model matching this data's
# provenance; it is control-aware and reports per-event log2 fold vs the no-tag
# control. We run it in event-calling mode (tag distributions + control);
# motif-defined subtypes (--seq/--back) are handled in the dedicated motif
# stage where we build the AT-rich GBS background explicitly.
# -----------------------------------------------------------------------------
peaks:
  chexmix_mappability: 0.98      # bacterial genome, unique mapping (default 0.8 is human)
  chexmix_mem_gb: 48             # java heap; ChExMix is memory-intensive
  chexmix_threads: 8
  chexmix_qvalue: 0.05           # event significance threshold
  chexmix_extra: ""              # extra flags, e.g. "--mappability 0.95"
  format: "BAM"                  # ChExMix reads BAM via the SAM loader
  chexmix_minfold: 1.5            # min fold over scaled control (default)
  chexmix_exclude: ""            # optional artifact-region BED (rRNA/tRNA); empty = off

# -----------------------------------------------------------------------------
# Depth-matched (symmetric) ChExMix control.
# All IP replicates from BOTH strains are subsampled to a single common read
# count (the minimum across the six IPs); controls likewise. This isolates the
# DEPTH component of the A909-vs-CJB111 event-count gap. It cannot equalise
# SignalFraction (0.185 vs 0.102) - that is the IP-efficiency difference itself.
# Results go to results/04_downsample/, leaving results/03_peaks/ untouched.
# -----------------------------------------------------------------------------
downsample:
  seed: 42

# -----------------------------------------------------------------------------
# Motif discovery, GAS-Per-box comparison, and peak classification.
# MEME-ChIP does UNBIASED de novo discovery under the PerR peaks; the GAS Per
# box (group A Strep; NO GBS-specific box exists — part of the novelty) is used
# only as a REFERENCE (TOMTOM similarity + FIMO occurrence), never to drive
# discovery.
# -----------------------------------------------------------------------------
motif:
  gas_perbox: "TTANAATNATTNTAA"   # GAS Per box consensus (reference only)
  # De novo GBS PerR motif discovered in this project. Recovered independently
  # by MEME and STREME in both serotypes (A909 reported as the reverse
  # complement CTTATTTAKAA; CJB111 as TTCTAAATAAS / ATTCTAAATAAG). Distinct
  # from the GAS box: TOMTOM p = 0.34, 6 bp overlap. A single IUPAC consensus
  # is scanned identically in BOTH genomes so cross-strain counts are
  # comparable; the strain-specific PWMs stay in memechip_*/combined.meme.
  gbs_perbox: "TTMTAAATAAG"     # kept: consensus form, used as a robustness check
  # Which representation of the GBS motif drives the FIMO scan.
  #   pwm       = the MEME-discovered position weight matrix (RECOMMENDED)
  #   consensus = iupac2meme on gbs_perbox above
  gbs_motif_source: "pwm"
  # Motif ID to extract from MEME-ChIP's combined.meme, and which strain's
  # discovery to take it from. ONE matrix scans BOTH genomes so the two hit
  # counts are directly comparable. A909 is used because its discovery is the
  # strongest (E = 2.3e-10 vs 7.7e-4 for the CJB111 MEME motif).
  gbs_pwm_strain: "A909"
  gbs_pwm_id: "1"
  bg_order: 1                     # fasta-get-markov Markov order (AT-rich genome)
  window: 500                     # bp window centered on each ChExMix event Point
  hiconf_min_reps: 3              # "hiconf" set = called in >= N replicates
  meme_mod: "zoops"               # zero-or-one occurrence per sequence
  meme_minw: 6                    # brackets the 15 bp Per box
  meme_maxw: 30
  memechip_extra: ""              # extra meme-chip flags if needed
  tomtom_thresh: 0.1              # TOMTOM E-value threshold
  fimo_thresh: 0.0001             # FIMO p-value threshold (default 1e-4)

# -----------------------------------------------------------------------------
# ChIP-exo x RNA-seq integration.
# Uses the RAW output sheets (all genes + stats), not the pre-filtered DEG
# sheets, so genes that are BOUND BUT NOT DIFFERENTIALLY EXPRESSED remain
# visible. The DEG sheets are read only to cross-check our thresholds.
# -----------------------------------------------------------------------------
integration:
  deg_excel: "data/DEG_supplementary.xlsx"   # <-- point at your workbook
  sheets:
    A909:
      raw:  "A909 raw output"
      degs: "A909 DEGs"
    CJB111:
      raw:  "CJB111 raw output"
      degs: "CJB111 DEGs"
  max_upstream: 300        # bp: peak within this distance 5' of a TSS = promoter
  operon_max_gap: 50       # bp: same-strand gap treated as co-transcribed
  deg_padj: 0.05
  deg_log2fc: 0.585
  perbox_source: "gbs"     # gas | gbs -- which Per box drives DIRECT_PERBOX
  # Peaks below this replication code are excluded from GENE ASSIGNMENT and
  # everything downstream (regulon tables, orthology, figures, IGV, pileup).
  # Peak calling and motif discovery are unaffected: discovery keeps all
  # sequences, where statistical power actually matters, while binding claims
  # rest only on reproducible peaks.
  #   1 = no filter   2 = called in >=2 replicates   3 = all three
  min_reps: 2

# -----------------------------------------------------------------------------
# Cross-serotype orthology (reciprocal best hits between the two proteomes).
# -----------------------------------------------------------------------------
orthology:
  evalue: 1e-5
  min_identity: 30      # % identity floor for a hit to count
  min_coverage: 50      # % of query length aligned
  flag_identity: 90     # RBH below this % identity is flagged for manual review

# -----------------------------------------------------------------------------
# Curated motif-database comparison (valid TOMTOM statistics).
# The earlier one-motif target database produced unusable p-values; the MEME
# Suite PROKARYOTE collections (CollecTF, PRODORIC, RegTransBase) provide a
# properly sized null.
# -----------------------------------------------------------------------------
motifdb:
  url: "https://meme-suite.org/meme/meme-software/Databases/motifs/motif_databases.12.26.tgz"
  # MEME "Combined Prokaryotes" = 558 motifs. Filenames are release-specific;
  # check resources/motif_databases/PROKARYOTE/ after download if the run fails.
  # fan2020.meme is deliberately omitted (Pseudomonas syringae HT-SELEX only).
  databases:
    - "prodoric_2021.9.meme"   # 333 motifs, w 5-34
    - "regtransbase.meme"      # 141 motifs, w 14-38
    - "collectf.meme"          #  84 motifs, w 9-53
  thresh: 0.5          # report matches up to this q-value (permissive; filter later)
  dist: "pearson"      # column comparison metric

# -----------------------------------------------------------------------------
# Motif-less peak analysis (results/13_motifless/).
#
# ~57% of A909 peaks carry no GBS motif at FIMO p<1e-4. This module asks why:
# degenerate sites, a second binding mode, or indirect tethering by a partner
# protein. The motif-POSITIVE subset is analysed identically as the control --
# a motif enriched only in the motif-less peaks means something; one present in
# both does not.
# -----------------------------------------------------------------------------
motifless:
  # MEME-ChIP reports this many motifs per subset. More than the default 1
  # because the question is whether ANY signal exists, not what the best one is.
  nmotifs: 5

  # Subsets smaller than this are flagged UNDERPOWERED in the report rather
  # than having a motif read off them. CJB111 has ~8 motif-less peaks; MEME on
  # 8 sequences will return something, and it will not mean anything.
  min_seqs: 20

# -----------------------------------------------------------------------------
# Orthologous-position signal test (results/09_pileup).
# Depth-matching removed SEQUENCING DEPTH as the explanation for A909 85 bound
# genes vs CJB111 28. It cannot remove IP EFFICIENCY: the half-slurry prep gives
# CJB111 SignalFraction 0.102 vs A909 0.185, and downsampling scales signal and
# background together. This module asks the discriminating question directly --
# what does the read pileup look like at the CJB111 position orthologous to each
# A909-only site, ignoring whether a peak was called there?
# -----------------------------------------------------------------------------
pileup:
  # bamCoverage. Coverage is built from results/04_downsample/bam (depth-matched),
  # NOT from the core's delivered bigwigs, which are full-depth with unknown
  # normalisation and would reintroduce the depth confound.
  # For 5'-end-only (crosslink-resolution) coverage instead of full read
  # coverage, set: "--Offset 1 --samFlagInclude 64"
  bamcoverage_extra: ""

  # Method (a): window at the orthologous gene's TSS, strand-aware.
  # 300 bp matches integration.max_upstream so the same promoter definition is
  # used throughout; 100 bp downstream catches sites just inside the 5' end.
  tss_upstream: 300
  tss_downstream: 100

  # Method (b): half-window around the lifted base. 100 bp is generous relative
  # to a ChIP-exo footprint (tens of bp) but tolerates small alignment offsets.
  lift_halfwindow: 100

  # nucmer anchor parameters. Defaults (20/65) are tuned for distant genomes;
  # these two strains are ~99% identical over the core, so longer anchors give
  # cleaner 1-to-1 blocks with fewer spurious repeat matches.
  nucmer_minmatch: 40
  nucmer_mincluster: 100

  # Random liftable positions defining the background distribution.
  n_null_positions: 2000
  null_seed: 42

# -----------------------------------------------------------------------------
# IGV asset generation (results/10_igv/).
#
# TWO DEPTHS ARE PRODUCED AND THEY ARE NOT INTERCHANGEABLE:
#   full_depth     DEFAULT for browsing and for any single-strain figure. Every
#                  read is used. Depth-matching would discard ~57% of A909's
#                  reads and 23 of its 87 events for no benefit here.
#   depth_matched  ONLY for figures making an explicit A909-vs-CJB111 claim,
#                  where unequal sequencing depth would otherwise confound it.
# -----------------------------------------------------------------------------
igv:
  depths: ["full_depth", "depth_matched"]
 
  # Coverage construction.
  #   offset 1 = use ONLY the 5' base of each read. In ChIP-exo that base IS the
  #   exonuclease stop, i.e. the footprint border. Set to 0 for full read
  #   coverage (broader, less precise, more robust if --Offset misbehaves).
  binsize: 1
  offset: 1
 
  # Display defaults written into the session XML. Autoscale is always OFF:
  # with it on, a weak signal and a strong signal render identically because
  # each is scaled to its own maximum.
  range_ip: 20
  range_ctrl: 20
  colors:
    forward:   "0,90,160"
    reverse:   "168,71,28"
    control:   "150,158,165"
    peaks:     "31,41,51"
    motif_gbs: "168,71,28"
    motif_gas: "107,122,138"
 
  # Locus-table window widths.
  #   context = gene body +/- this, for a first look and for figure panels
  #   zoom    = TSS +/- this, which is what resolves the strand doublet
  flank_context: 750
  flank_zoom: 250

# How resource paths are written into the session XML.
  #   relative  RECOMMENDED. Anchored on the session file's own directory, so
  #             `tar czf igv_bundle.tar.gz results/10_igv` opens on any machine.
  #   absolute  Cluster-only. Convenient if you never move the files and prefer
  #             paths you can paste into a terminal.
  path_style: "relative"

# -----------------------------------------------------------------------------
# Parameter sensitivity (results/11_sensitivity/).
#
# Every value below is a STRING, deliberately: these strings go straight into
# directory names, so "1.0" and "1" cannot silently produce two directories for
# the same setting.
#
# config/config.yaml is NEVER modified by this module. Each combination writes
# to its own subtree and reads the production files without touching them.
# -----------------------------------------------------------------------------
sensitivity:
 
  # ---- seconds. Run routinely. --------------------------------------------
  cheap:
    # Peak -> gene assignment. Robison et al. PNAS 99:7304 (2002) support ~300 nt
    # upstream; the GBS same-strand intergenic distribution has its within-operon
    # mode below ~20 bp and goes flat above ~30, so 0-100 brackets the trough.
    assignment:
      max_upstream: ["200", "300", "400"]
      operon_max_gap: ["0", "50", "100", "150", "200"]

    reproducibility:
      min_reps: ["1", "2", "3"]
 
    # Differential-expression cutoffs. 0.585 = 1.5-fold (production), 1.0 = 2-fold,
    # 1.5 = ~2.8-fold. Likely the largest remaining lever on the direct/indirect
    # split, since it decides which bound genes count as responsive.
    deg:
      padj: ["0.01", "0.05"]
      log2fc: ["0.585", "1", "1.5"]
 
    # Reciprocal-best-hit floors. BLAST is not re-run; the same output is
    # re-filtered, which is why this costs seconds.
    orthology:
      min_identity: ["30", "50"]
      min_coverage: ["50", "70"]
 
  # ---- minutes ------------------------------------------------------------
  moderate:
    # Directly moves the "37 of 87 peaks carry the motif" figure.
    fimo:
      thresh: ["1e-3", "1e-4", "1e-5"]
 
  # ---- hours. Opt-in. -----------------------------------------------------
  expensive:
    # THE HALF-SITE QUESTION. Production capped width at 20 bp, which would
    # truncate a full Fur-family 7-1-7 inverted repeat (~22-30 bp).
    #   zoops = zero or one occurrence per sequence (production)
    #   anr   = any number -- the only mode that can report TWO copies in one
    #           window, which is what a dimer on an inverted repeat produces
    meme:
      maxw: ["20", "30"]       # MEME 5.5.9 caps maxw at 30
      mod: ["zoops", "anr"]
 
    # --minfold is LINEAR fold, not log2: 1.0 disables the enrichment filter,
    # 1.5 is production, 2.0 is stricter. ~28 min per strain per combination.
    chexmix:
      qvalue: ["0.01", "0.05"]
      minfold: ["1.0", "1.5", "2.0"]
 
  # Which axes appear in SENSITIVITY_REPORT.md. Add "fimo" once it has run.
  report_axes: ["assignment", "reproducibility", "deg", "orthology"]

# -----------------------------------------------------------------------------
# Cross-caller concordance (results/12_concordance/).
#
# The GEM run itself is NOT a pipeline rule: it needed hand-calibrated --icr and
# --a because GEM's estimators degrade at this coverage depth (see
# workflow/scripts/gem_concordance.sh). Only the comparison is automated, so the
# number quoted in the manuscript regenerates from the workflow.
# -----------------------------------------------------------------------------
concordance:
  # Paths to the GEM event files produced by gem_concordance.sh.
  # Omit a strain to skip it.
  gem_events:
    A909: "results/gem_icr/A9091_a50/A9091_a50.GPS_events.txt"

  # Several tolerances: the two callers segment dense regions differently, so a
  # single number would either understate agreement (strict) or overstate it
  # (loose). Both are reported.
  tolerances: [25, 50, 100, 200]

  # Loci checked individually in the log.
  flagship:
    perR_autoregulation: 410421
    ABC_transporter_operon: 758769
    VIT1_CCC1_anchor: 874861
    SAK_RS04085: 1407424
